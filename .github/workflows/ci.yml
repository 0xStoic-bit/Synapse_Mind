# Synapse Mind sürekli entegrasyon (v0.1.1).
# Gate 2 (RAM dökümü) masaüstü oturumu gerektirdiği için burada koşmaz;
# elle ya da kendi barındırılan bir koşucuda çalıştırılır.
name: ci

on:
  push:
    branches: [main, "v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, Gate 1
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust araç zinciri (rust-toolchain.toml)
        run: |
          rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
            tests/security/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Arayüz derlemesi (src-tauri gömülü UI için gerekli)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Biçim (fmt)
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path tests/security/Cargo.toml --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Testler
        run: |
          cargo test --workspace
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Gate 1 (PII sızıntı regresyonu)
        run: cargo test -p s-redteam --no-fail-fast -- --include-ignored
