[package]
name = "s-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
fastembed = ["dep:fastembed"]

[dependencies]
s-types.workspace = true
tokio.workspace = true
zeroize.workspace = true
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "cache"] }
sqlite-vec = "=0.1.9"
fastembed = { version = "7.7.1", optional = true, default-features = false, features = ["onnx", "ort-download-binaries-native-tls", "hf-hub-native-tls"] }
